[package]
name = "playback-desktop"
version = "0.1.0"
description = "PlayBack desktop shell powered by Tauri and mpv"
authors = ["The PlayBack contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/useless-rs/PlayBack"
edition = "2024"
rust-version = "1.85"

[lib]
name = "playback_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = ["config-json"] }

[dependencies]
anyhow = "1"
parking_lot = "0.12"
playback-config = { path = "../crates/playback-config" }
playback-core = { path = "../crates/playback-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.3", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2.4.1"
tauri-plugin-fs = "2.4.4"
tauri-plugin-opener = "2.5.0"
tauri-plugin-os = "2.3.1"
tauri-plugin-window-state = "2.4.0"
