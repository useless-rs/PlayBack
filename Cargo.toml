[package]
name = "playback"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A fast, configurable video player powered by libmpv."
repository = "https://github.com/playback-rs/playback"
readme = "README.md"
keywords = ["video", "player", "mpv", "multimedia"]
categories = ["multimedia::video", "command-line-utilities"]

[workspace]
resolver = "2"
members = [
    "crates/playback-core",
    "crates/playback-config",
    "crates/playback-ui",
    "crates/playback-cli",
]
exclude = ["src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["The PlayBack contributors"]
repository = "https://github.com/playback-rs/playback"
homepage = "https://github.com/playback-rs/playback"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
multiple_crate_versions = "allow"
struct_excessive_bools = "allow"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
unreachable = "deny"
dbg_macro = "deny"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
crossbeam-channel = "0.5"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "async"] }
notify = "8.0"
parking_lot = "0.12"
playback-cli = { path = "crates/playback-cli", version = "0.1.0" }
playback-config = { path = "crates/playback-config", version = "0.1.0" }
playback-core = { path = "crates/playback-core", version = "0.1.0" }
playback-ui = { path = "crates/playback-ui", version = "0.1.0" }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies]
anyhow = { workspace = true }
playback-cli = { path = "crates/playback-cli", version = "0.1.0" }
playback-config = { path = "crates/playback-config", version = "0.1.0" }
playback-core = { path = "crates/playback-core", version = "0.1.0" }
playback-ui = { path = "crates/playback-ui", version = "0.1.0" }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[features]
default = ["native"]
native = ["playback-ui/native", "playback-core/native-mpv"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 1

[profile.dev]
opt-level = 0
debug = true
incremental = true
