name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm
            artifact: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/playback-desktop
          - os: macos-latest
            bundles: dmg
            artifact: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: msi,nsis
            artifact: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install system dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y mpv libmpv-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install mpv
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run desktop:build -- --bundles "${{ matrix.bundles }}"

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: playback-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*
